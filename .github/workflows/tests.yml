name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile canvas_sync.py canvas_scheduled_sync.py manager.py setup.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check double-click commands
        run: zsh -n *.command

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install development tools
        run: python -m pip install black==26.5.1 ruff==0.15.1
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
